name: tablet_browser
description: "平板浏览器：支持在线/本地静态与动态网页，内置白名单/黑名单网址过滤。"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # App-private storage for the rule file, settings and the local site root.
  path_provider: ^2.1.5
  # Salted password hashing for the parental gate. Pure Dart, no native code,
  # so it adds nothing to the Android build.
  crypto: ^3.0.6
  # Pinned below 2.3.x on purpose: path_provider_android 2.3+ depends on the
  # `jni` / `jni_flutter` plugins, which are native builds requiring a CMake
  # toolchain in the Android SDK. 2.2.x uses the plain platform channel and
  # needs no native toolchain, which keeps `flutter build apk` working on a
  # plain SDK install.
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/policy_test_vectors.json
    - assets/start_page.html
